migration {
  # Flyway keeps its schema history in this database, in a schema it creates itself; the
  # Iceberg tables live in the catalog below.
  flyway {
    url = "jdbc:postgresql://localhost:5432/postgres"
    url = ${?FLYWAY_URL}
    user = "postgres"
    user = ${?FLYWAY_USER}
    password = "postgres"
    password = ${?FLYWAY_PASSWORD}
    schema = "iceberg_flyway"
    schema = ${?FLYWAY_SCHEMA}
  }
  # Keys are Iceberg catalog properties (CatalogUtil.buildIcebergCatalog). Local default: a
  # Hadoop catalog on the local file system. On AWS set type = glue and an s3:// warehouse
  # through the environment; the Glue catalog uses S3FileIO unless io-impl says otherwise.
  iceberg {
    name = "iceberg"
    properties {
      type = "hadoop"
      type = ${?ICEBERG_CATALOG_TYPE}
      warehouse = "file://"${user.dir}"/target/iceberg-warehouse"
      warehouse = ${?ICEBERG_WAREHOUSE}
      io-impl = ${?ICEBERG_IO_IMPL}
    }
  }
}
